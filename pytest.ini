[pytest]
testpaths = tests
norecursedirs = .git _analyze_temp artifacts __pycache__
addopts = -p tests.safety.pytest_plugin -m "not real_dwg and not external_integration and not autocad_required and not tianzheng_required and not com_required and not production_only"
markers =
    real_dwg: 需要访问显式隔离的真实 DWG/DXF；默认安全回归必须排除
    external_integration: 需要外部进程、服务或真实文件环境；默认安全回归必须排除
    autocad_required: 需要 AutoCAD；默认安全回归必须排除
    tianzheng_required: 需要天正；默认安全回归必须排除
    com_required: 需要 COM；默认安全回归必须排除
    real_autocad: 真实 AutoCAD 集成；仅显式 opt-in 命令可运行
    integration: 外部集成测试；默认安全回归必须排除
    requires_autocad: 需要真实 AutoCAD；默认安全回归必须排除
    synthetic_cad: 仅允许访问当前测试或显式 S5 集成运行所登记的合成 CAD 文件；不得访问用户图纸
    production_only: 仅受控生产环境可运行；默认安全回归必须排除
    guard_self_test: 文件访问守卫专项自测；预期阻断单独计数
